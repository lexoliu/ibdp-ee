[package]
name = "benchmark-server"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["tokio", "http1"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
once_cell = "1"
parking_lot = "0.12"
crossbeam-channel = "0.5"
minijinja = "2"
bytes = "1"

[[bin]]
name = "server"
path = "src/main.rs"
